[package]
name = "latsec"
version = "0.1.0"
edition = "2021"
# The pinned zeroize 1.9 needs Rust 1.85 (edition 2024); nothing else needs more.
rust-version = "1.85"
description = "Research prototype of SEC secret sharing and the LaTSEC threshold signature"
publish = false

[dependencies]
getrandom = "0.2"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha3 = "0.10"
zeroize = "1"

[dev-dependencies]
num-rational = "0.4"

# Exact big-integer algebra and full-degree ring arithmetic are too slow to test
# without optimization.
[profile.dev]
opt-level = 2

[profile.release]
debug = 1
